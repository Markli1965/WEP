<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>WEP 2026 Staff Portal</title>

  <style>
    :root {
      --navy: #17365d;
      --yellow: #ffd966;
      --background: #eef2f7;
      --line: #d5dde7;
      --muted: #526174;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--background);
      color: #1f2937;
      font: 16px/1.55 Arial, Helvetica, sans-serif;
    }

    header {
      background: var(--navy);
      color: white;
      border-bottom: 6px solid var(--yellow);
      padding: 26px 20px;
    }

    .wrap { max-width: 1000px; margin: auto; }
    main { padding: 22px 16px 48px; }

    h1 { font-size: 1.7rem; margin: 0 0 6px; }
    h2 { font-size: 1.3rem; margin: 0 0 12px; }
    h3 { font-size: 1.05rem; margin: 22px 0 10px; }
    p { margin: 8px 0; }

    .panel, .organisation {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px #17365d0c;
    }

    #loginPanel { max-width: 520px; margin: 20px auto; }
    .organisation { border-top: 5px solid var(--navy); }
    .organisation h2 { color: var(--navy); }
    .muted, .hint { color: var(--muted); }
    .hint { font-size: .9rem; }
    .view-field { margin-bottom: 16px; }

    label {
      display: block;
      font-weight: bold;
      color: var(--navy);
      margin-bottom: 7px;
    }

    input, select, button {
      font: inherit;
      min-height: 46px;
      border-radius: 7px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #8999ad;
      background: white;
      color: #1f2937;
    }

    button {
      padding: 10px 18px;
      border: 1px solid var(--navy);
      background: var(--navy);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled { opacity: .6; cursor: wait; }
    .primary { background: var(--yellow); color: var(--navy); }
    .outline { background: white; color: var(--navy); }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    :focus-visible {
      outline: 3px solid #c77800;
      outline-offset: 3px;
    }

    #loginMessage, #status {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    #summary { margin: 18px 0; font-weight: bold; }

    .contact {
      background: #f5f7fa;
      border: 1px solid var(--line);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    dl { margin: 0; }
    dt { font-weight: bold; color: var(--navy); margin-top: 9px; }
    dt:first-child { margin-top: 0; }

    dd {
      margin: 2px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    a { color: #164d88; text-underline-offset: 3px; }

    .student {
      border-top: 1px solid var(--line);
      padding: 15px 0;
    }

    .student strong { display: block; }

    .guidance {
      background: #fff7da;
      padding: 14px;
      border-radius: 8px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    caption {
      text-align: left;
      font-weight: bold;
      margin-bottom: 12px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th { background: var(--navy); color: white; }
    td { overflow-wrap: anywhere; }
    .class-table { min-width: 560px; }
    details { margin-top: 10px; }

    summary {
      cursor: pointer;
      color: var(--navy);
      font-weight: bold;
    }

    details dl { margin-top: 10px; }

    @media (max-width: 600px) {
      h1 { font-size: 1.4rem; }
      .panel, .organisation { padding: 16px; }
      .actions button { flex: 1 1 130px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <h1>WEP 2026 Staff Portal</h1>
      <div>St Andrew’s School (Secondary)</div>
      <div>Organisation contacts, student allocations and attachment guidance</div>
    </div>
  </header>

  <main class="wrap">
    <noscript>
      <p>This portal requires JavaScript to be enabled in your browser.</p>
    </noscript>

    <section id="loginPanel" class="panel">
      <h2>Staff access</h2>
      <p class="muted">Enter the shared password to view WEP information.</p>

      <form id="loginForm">
        <label for="password">Shared password</label>
        <input id="password" type="password"
               autocomplete="off" required>

        <div class="actions">
          <button id="unlockButton" class="primary" type="submit">
            Open portal
          </button>
        </div>
      </form>

      <p id="loginMessage" role="status" aria-live="polite"></p>
      <p class="hint">
        Reloading or closing this page requires you to enter the password again.
      </p>
    </section>

    <section id="portal" hidden>
      <div class="panel">
        <div class="view-field">
          <label for="viewMode">View by</label>
          <select id="viewMode">
            <option value="mentor">Teacher Mentor</option>
            <option value="class">Form Teacher — Class</option>
          </select>
        </div>

        <label id="selectionLabel" for="mentor">Select your name</label>
        <select id="mentor">
          <option value="">Choose a teacher mentor</option>
        </select>

        <div class="actions">
          <button id="refreshButton" type="button">Refresh data</button>
          <button id="lockButton" class="outline" type="button">
            Lock portal
          </button>
        </div>

        <p id="status" class="hint" role="status" aria-live="polite"></p>
      </div>

      <p id="summary" role="status" aria-live="polite"></p>
      <div id="results"></div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const API_URL =
        "https://script.google.com/macros/s/AKfycbzETHPwPW0z8EZPDTNiQbHSZdbrId2UYA47ZIxxX_99ippjMVtbJcZyGHJAmVoH4gY/exec";

      const $ = id => document.getElementById(id);
      let records = [];
      let passwordInMemory = "";
      let busy = false;
      let loadedAt = "";

      function element(tag, content, className) {
        const node = document.createElement(tag);
        if (content !== undefined) node.textContent = content;
        if (className) node.className = className;
        return node;
      }

      function text(value) {
        return String(value == null ? "" : value).trim();
      }

      function optional(value) {
        const valueText = text(value);
        return /^(0|NA|N\/A)$/i.test(valueText) ? "" : valueText;
      }

      function addField(list, label, value, kind) {
        value = optional(value);
        if (!value) return;

        list.appendChild(element("dt", label));
        const detail = element("dd");

        const singleEmail = /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;
        const singlePhone = /^\+?[\d ()-]{7,22}$/;

        if (kind === "email" && singleEmail.test(value)) {
          const link = element("a", value);
          link.href = "mailto:" + encodeURIComponent(value);
          detail.appendChild(link);
        } else if (kind === "phone" && singlePhone.test(value)) {
          const link = element("a", value);
          link.href = "tel:" + value.replace(/[^\d+]/g, "");
          detail.appendChild(link);
        } else {
          detail.textContent = value;
        }

        list.appendChild(detail);
      }

      function setBusy(value) {
        busy = value;
        $("unlockButton").disabled = value;
        $("refreshButton").disabled = value;
        $("lockButton").disabled = value;
        $("mentor").disabled = value;
        $("viewMode").disabled = value;
        $("password").disabled = value;
      }

      function populateSelections(previousSelection = "") {
        const isClass = $("viewMode").value === "class";
        const key = isClass ? "className" : "teacherMentor";

        $("selectionLabel").textContent =
          isClass ? "Select your class" : "Select your name";

        const choices = [...new Set(
          records.map(row => text(row[key])).filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, "en", { numeric: true }));

        $("mentor").replaceChildren(new Option(
          isClass ? "Choose a class" : "Choose a teacher mentor", ""
        ));

        choices.forEach(value => {
          $("mentor").appendChild(new Option(value, value));
        });

        if (choices.includes(previousSelection)) {
          $("mentor").value = previousSelection;
        }
      }

      function lockPortal(message = "") {
        records = [];
        passwordInMemory = "";
        loadedAt = "";
        $("password").value = "";
        $("viewMode").value = "mentor";
        populateSelections();
        $("results").replaceChildren();
        $("summary").textContent = "";
        $("status").textContent = "";
        $("portal").hidden = true;
        $("loginPanel").hidden = false;
        $("loginMessage").textContent = message;
      }

      async function loadData(enteredPassword, refreshing) {
        if (busy) return;
        setBusy(true);

        const message = refreshing ? $("status") : $("loginMessage");
        message.textContent = "Checking access and loading current data…";

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 30000);

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            body: new URLSearchParams({ password: enteredPassword }),
            credentials: "omit",
            redirect: "follow",
            cache: "no-store",
            signal: controller.signal
          });

          if (!response.ok) throw new Error("CONNECTION");

          let result;
          try {
            result = await response.json();
          } catch {
            throw new Error("CONNECTION");
          }

          if (!result.success) {
            throw new Error(result.error || "DATA_UNAVAILABLE");
          }

          if (!Array.isArray(result.records)) {
            throw new Error("DATA_UNAVAILABLE");
          }

          const previousSelection = $("mentor").value;
          records = result.records;
          passwordInMemory = enteredPassword;
          $("password").value = "";
          populateSelections(previousSelection);

          loadedAt = new Date().toLocaleString("en-SG", {
            timeZone: "Asia/Singapore"
          });

          $("status").textContent =
            "Data loaded " + loadedAt + " (Singapore time). " +
            "Use Refresh data to check for changes.";

          $("loginMessage").textContent = "";
          $("loginPanel").hidden = true;
          $("portal").hidden = false;
          renderMentor();

        } catch (error) {
          if (error.message === "UNAUTHORIZED") {
            lockPortal("Password not accepted. Please enter it again.");
          } else {
            const explanation =
              error.message === "DATA_UNAVAILABLE"
                ? "The service could not read the Sheet. Please contact the WEP coordinator."
                : "Unable to load data. Check your connection and try again.";

            message.textContent = explanation +
              (refreshing && loadedAt
                ? " Still showing data loaded " + loadedAt + "."
                : "");
          }
        } finally {
          clearTimeout(timer);
          setBusy(false);
          if (!$("portal").hidden && !refreshing) $("mentor").focus();
        }
      }

      function renderClass() {
        const className = $("mentor").value;

        if (!className) {
          $("summary").textContent =
            "Select a class to view its students, organisations and teacher mentors.";
          return;
        }

        const students = records
          .filter(row => text(row.className) === className)
          .slice()
          .sort((a, b) =>
            text(a.serialNumber).localeCompare(
              text(b.serialNumber), "en", { numeric: true }
            ) ||
            text(a.studentName).localeCompare(text(b.studentName))
          );

        const organisationCount = new Set(
          students.map(row => text(row.organisation)).filter(Boolean)
        ).size;

        $("summary").textContent =
          className + " — " + students.length + " student record(s), " +
          organisationCount + " organisation(s)";

        const panel = element("section", undefined, "panel");
        panel.appendChild(element(
          "p",
          "Open a student's attachment details for contact information and guidance.",
          "hint"
        ));

        const wrap = element("div", undefined, "table-wrap");
        wrap.tabIndex = 0;
        wrap.setAttribute("role", "region");
        wrap.setAttribute(
          "aria-label",
          "Class allocations; scroll horizontally on smaller screens"
        );

        const table = element("table", undefined, "class-table");
        table.appendChild(element(
          "caption", "WEP allocations — " + className
        ));

        const head = element("thead");
        const headings = element("tr");

        ["S/N", "Student", "Organisation", "Teacher mentor"]
          .forEach(label => {
            const heading = element("th", label);
            heading.scope = "col";
            headings.appendChild(heading);
          });

        head.appendChild(headings);
        table.appendChild(head);

        const body = element("tbody");

        students.forEach(student => {
          const row = element("tr");
          row.appendChild(element("td", text(student.serialNumber)));
          row.appendChild(element("td", text(student.studentName)));

          const organisation = element(
            "td", text(student.organisation) || "Not provided"
          );

          const details = element("details");
          details.appendChild(element("summary", "Attachment details"));

          const list = element("dl");

          [
            ["studentEmail", "Student email", "email"],
            ["address", "Organisation address"],
            ["contactPerson", "Contact person"],
            ["designation", "Designation"],
            ["contactEmail", "Contact email", "email"],
            ["contactNumber", "Phone", "phone"],
            ["workAreas", "Possible areas of work"],
            ["studentRemarks", "Remarks for students"],
            ["mentorRemarks", "Remarks for teacher mentor"]
          ].forEach(([key, label, kind]) => {
            addField(list, label, student[key], kind);
          });

          if (list.children.length) {
            details.appendChild(list);
          } else {
            details.appendChild(element(
              "p", "No additional information provided."
            ));
          }

          organisation.appendChild(details);
          row.appendChild(organisation);
          row.appendChild(element(
            "td", text(student.teacherMentor) || "Not provided"
          ));
          body.appendChild(row);
        });

        table.appendChild(body);
        wrap.appendChild(table);
        panel.appendChild(wrap);
        $("results").appendChild(panel);
      }

      function renderMentor() {
        $("results").replaceChildren();

        if ($("viewMode").value === "class") {
          renderClass();
          return;
        }

        const mentor = $("mentor").value;

        if (!mentor) {
          $("summary").textContent =
            "Select your name to view your organisations and students.";
          return;
        }

        const assigned = records.filter(
          row => text(row.teacherMentor) === mentor
        );

        const organisations = new Map();

        assigned.forEach(row => {
          const name = text(row.organisation) || "Organisation not provided";
          if (!organisations.has(name)) organisations.set(name, []);
          organisations.get(name).push(row);
        });

        $("summary").textContent =
          mentor + " — " + organisations.size + " organisation(s), " +
          assigned.length + " student record(s)";

        [...organisations.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .forEach(([name, students]) => {
            $("results").appendChild(renderOrganisation(name, students));
          });
      }

      function renderOrganisation(name, students) {
        const card = element("article", undefined, "organisation");
        card.appendChild(element("h2", name));
        card.appendChild(element(
          "p", students.length + " student record(s)", "muted"
        ));

        const contactFields = [
          ["address", "Address"],
          ["contactPerson", "Contact person"],
          ["designation", "Designation"],
          ["contactEmail", "Email", "email"],
          ["contactNumber", "Phone", "phone"]
        ];

        const profiles = new Map();

        students.forEach(student => {
          const values = contactFields.map(
            ([key]) => optional(student[key])
          );
          const key = JSON.stringify(values);

          if (!profiles.has(key)) {
            profiles.set(key, { values, students: [] });
          }
          profiles.get(key).students.push(student);
        });

        card.appendChild(element("h3", "Organisation contact details"));

        profiles.forEach(profile => {
          const block = element("div", undefined, "contact");

          if (profiles.size > 1) {
            block.appendChild(element(
              "p",
              "Listed for: " + profile.students.map(student =>
                text(student.studentName) +
                " (" + text(student.className) + ")"
              ).join(", "),
              "hint"
            ));
          }

          const list = element("dl");

          contactFields.forEach(([, label, kind], index) => {
            addField(list, label, profile.values[index], kind);
          });

          if (list.children.length) {
            block.appendChild(list);
          } else {
            block.appendChild(element("p", "Contact details not provided."));
          }

          card.appendChild(block);
        });

        const guidanceFields = [
          ["workAreas", "Possible areas of work"],
          ["studentRemarks", "Remarks for students"],
          ["mentorRemarks", "Remarks for teacher mentor"]
        ];

        const commonKeys = new Set();
        const sharedGuidance = element("dl", undefined, "guidance");

        guidanceFields.forEach(([key, label]) => {
          const values = students.map(student => optional(student[key]));

          if (values[0] && values.every(value => value === values[0])) {
            commonKeys.add(key);
            addField(sharedGuidance, label, values[0]);
          }
        });

        if (sharedGuidance.children.length) {
          card.appendChild(element("h3", "Attachment guidance"));
          card.appendChild(sharedGuidance);
        }

        card.appendChild(element("h3", "Boys attached"));

        students.slice().sort((a, b) =>
          text(a.className).localeCompare(text(b.className)) ||
          text(a.studentName).localeCompare(text(b.studentName))
        ).forEach(student => {
          const block = element("div", undefined, "student");

          block.appendChild(element("strong", text(student.studentName)));
          block.appendChild(element(
            "div", text(student.className), "muted"
          ));

          const details = element("dl");
          addField(details, "Student email", student.studentEmail, "email");

          guidanceFields.forEach(([key, label]) => {
            if (!commonKeys.has(key)) {
              addField(details, label, student[key]);
            }
          });

          block.appendChild(details);
          card.appendChild(block);
        });

        return card;
      }

      $("loginForm").addEventListener("submit", event => {
        event.preventDefault();
        const enteredPassword = $("password").value;
        if (enteredPassword) loadData(enteredPassword, false);
      });

      $("mentor").addEventListener("change", renderMentor);

      $("viewMode").addEventListener("change", () => {
        populateSelections();
        renderMentor();
      });

      $("refreshButton").addEventListener("click", () => {
        if (passwordInMemory) loadData(passwordInMemory, true);
      });

      $("lockButton").addEventListener("click", () => {
        lockPortal("Portal locked.");
        $("password").focus();
      });

      window.addEventListener("pagehide", () => lockPortal());
    })();
  </script>
</body>
</html>
